[project]
name = "cutlist"
version = "0.1.0"
description = "Assemble short captioned clips from a long video"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Maliarov" }]
keywords = ["video", "ffmpeg", "scene-detection", "editing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cutlist = "cutlist.cli:app"

[project.urls]
Repository = "https://github.com/samalyarov/cutlist"
Issues = "https://github.com/samalyarov/cutlist/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cutlist*"]

# page.html is the review UI, and the first runtime asset here that is not a
# .py file. Without this a wheel ships the code and not the page, so a
# non-editable install serves GET / into a FileNotFoundError.
[tool.setuptools.package-data]
"cutlist.review" = ["page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
