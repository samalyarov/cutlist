name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg and ffprobe drive every media test. fonts-dejavu-core installs
      # DejaVuSans-Bold at the exact path caption.py falls back to on Linux,
      # which is what makes captions work here and in the container.
      # scenedetect drags in the non-headless opencv build, which needs libGL even
      # though cutlist itself pins the headless one.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core libgl1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t cutlist:ci .

      # The image is only useful if the entrypoint runs, and `demo` is the one
      # command that needs no input file.
      - name: Smoke test
        run: docker run --rm cutlist:ci --help
