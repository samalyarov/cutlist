name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg and ffprobe drive every media test. fonts-dejavu-core installs
      # DejaVuSans-Bold at the exact path caption.py falls back to on Linux,
      # which is what makes captions work here and in the container.
      # scenedetect drags in the non-headless opencv build, which needs libGL even
      # though cutlist itself pins the headless one.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core libgl1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t cutlist:ci .

      # --help only proves the entrypoint resolves. demo is the one command
      # that needs no input file, so it is what actually exercises ffmpeg,
      # scenedetect, opencv, the font and the packaged demo.yaml inside the
      # image -- the difference between a container that starts and one that
      # works. Runs entirely inside the container (no bind mount) so the
      # check is not tripped up by the image's non-root user not owning a
      # host-side directory.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh cutlist:ci -c '
            cutlist demo --count 2 &&
            count=$(find output -name "*.mp4" | wc -l) &&
            if [ "$count" -ne 2 ]; then
              echo "expected 2 clips, found $count" >&2
              exit 1
            fi
          '
